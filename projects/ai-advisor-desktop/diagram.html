const NS="http://www.w3.org/2000/svg", svg=document.getElementById("d");
const W=SPEC.width||1600, H=SPEC.height||1000;
svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H);
document.getElementById("ttl").textContent=SPEC.title||"";
const el=(t,a={},p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const txt=(p,x,y,s,a={})=>{const t=el("text",{x,y,"font-size":12,fill:"#1b1f24",...a},p);t.textContent=s;return t};
 
/* ---------- Visual grammar (single source of truth; mirrors SKILL.md) ---------- */
const GROUP={
  internet:{stroke:"#8a94a1",dash:"",fill:"#fafbfc",w:1,label:"#5b6470"},
  onprem:{stroke:"#5b6470",dash:"",fill:"#f3f4f6",w:1.5,label:"#3b424a"},
  cloud:{stroke:"#0078D4",dash:"",fill:"#ffffff",w:1.5,label:"#0078D4"},          // Azure boundary
  subscription:{stroke:"#7f8ea3",dash:"",fill:"none",w:1,label:"#5b6470"},
  rg:{stroke:"#a3adb9",dash:"6 3",fill:"none",w:1,label:"#5b6470"},               // resource group (logical)
  region:{stroke:"#5b6470",dash:"10 5",fill:"none",w:1.5,label:"#3b424a"},         // region: long dash
  vnet:{stroke:"#3b8a3e",dash:"2 4",fill:"#f6fbf4",w:2.5,label:"#2d6e30",cap:"round"}, // VNet: DOTTED
  "subnet-public":{stroke:"#7fba00",dash:"",fill:"#eef7e3",w:1.25,label:"#3d6b00"},
  "subnet-private":{stroke:"#5a8fc9",dash:"",fill:"#edf3fa",w:1.25,label:"#1f4f86"},
  zone:{stroke:"#9aa5b1",dash:"4 4",fill:"none",w:1,label:"#5b6470"},              // availability zone lane
  cluster:{stroke:"#8661c5",dash:"",fill:"#f6f2fc",w:1.25,label:"#5a3d91"},        // distributed group / replica set
  external:{stroke:"#c8ced6",dash:"",fill:"#fbfbfc",w:1,label:"#5b6470"}           // shared/platform services band
};
const EDGE={
  sync:{c:"#0078D4",w:2,dash:"",pk:true,name:"Synchronous request (HTTPS/gRPC/SQL)"},
  async:{c:"#E8730C",w:2,dash:"8 5",pk:true,name:"Asynchronous message / event"},
  replication:{c:"#8661C5",w:2,dash:"12 4 2 4",pk:true,bidir:true,name:"Data replication / sync"},
  hybrid:{c:"#5C2D91",w:3.5,dash:"",pk:true,bidir:true,name:"Hybrid link (ExpressRoute / VPN)"},
  peering:{c:"#3b8a3e",w:3,dash:"",pk:false,bidir:true,double:true,name:"VNet peering"},
  privatelink:{c:"#00A3A3",w:1.75,dash:"2 3",pk:false,arrow:false,name:"Private Link (private endpoint ↔ PaaS)"},
  control:{c:"#8a94a1",w:1.25,dash:"3 3",pk:false,name:"Control plane / identity / telemetry"},
  admin:{c:"#D13438",w:1.5,dash:"",pk:true,name:"Privileged admin access"}
};
 
/* ---------- defs: arrow markers ---------- */
const defs=el("defs");
for(const k in EDGE){
  const m=el("marker",{id:"a-"+k,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:11,markerHeight:11,markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},defs);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:EDGE[k].c},m);
}
el("rect",{x:0,y:0,width:W,height:H,fill:"#fff"});
 
/* ---------- title ---------- */
txt(svg,28,40,SPEC.title||"",{"font-size":22,"font-weight":600});
if(SPEC.subtitle) txt(svg,28,62,SPEC.subtitle,{"font-size":13,fill:"#5b6470"});
 
/* ---------- groups (draw in spec order: outermost first) ---------- */
const gL=el("g",{id:"groups"});
const used={groups:new Set(),edges:new Set()};
for(const g of SPEC.groups||[]){
  const s=GROUP[g.kind]||GROUP.external; used.groups.add(g.kind);
  el("rect",{x:g.x,y:g.y,width:g.w,height:g.h,rx:g.kind==="zone"?4:8,fill:s.fill,stroke:s.stroke,"stroke-width":s.w,"stroke-dasharray":s.dash,"stroke-linecap":s.cap||"butt"},gL);
  let lx=g.x+12; const top=g.labelPos==="bottom"?g.y+g.h-30:g.y; const ly=top+20;
  if(g.kind==="subnet-public"||g.kind==="subnet-private"){ // PUBLIC / PRIVATE pill leads the label
    const pub=g.kind==="subnet-public", pw=pub?56:62;
    el("rect",{x:lx,y:top+8,width:pw,height:16,rx:8,fill:pub?"#5c8a00":"#1f4f86"},gL);
    txt(gL,lx+pw/2,top+19.5,pub?"PUBLIC":"PRIVATE",{"font-size":9.5,"font-weight":700,fill:"#fff","text-anchor":"middle","letter-spacing":".5"});
    lx+=pw+6;
  }
  const ic=g.kind==="vnet"?"virtual-networks":null;
  if(ic&&ICONS[ic]){el("image",{href:ICONS[ic],x:lx,y:top+7,width:18,height:18},gL);lx+=24;}
  const t=txt(gL,lx,ly,g.label||"",{"font-size":g.kind==="zone"?11:12.5,"font-weight":600,fill:s.label});
  let after=lx+t.getComputedTextLength()+8;
  if(g.cidr) txt(gL,after,ly,g.cidr,{"font-size":11,fill:"#5b6470","font-family":"Consolas,monospace"});
  if(g.note) txt(gL,g.x+12,g.labelPos==="bottom"?g.y+18:g.y+40,g.note,{"font-size":10.5,fill:"#5b6470","font-style":"italic"});
}
 
/* ---------- nodes ---------- */
const N={}; const nL=el("g",{id:"nodes"}); const IS=44;
for(const n of SPEC.nodes||[]){
  N[n.id]=n; const g=el("g",{opacity:n.status==="standby"?.5:1},nL);
  const ix=n.x-IS/2, iy=n.y-IS/2-8;
  for(let i=Math.min(n.stack||1,3)-1;i>0;i--){ // replicas: ghost copies behind
    el("rect",{x:ix+i*5,y:iy-i*5,width:IS,height:IS,rx:6,fill:"#fff",stroke:"#c3cad3"},g);
  }
  el("rect",{x:ix-4,y:iy-4,width:IS+8,height:IS+8,rx:8,fill:"#fff",stroke:n.highlight?"#0078D4":"none","stroke-width":2},g);
  if(n.icon&&ICONS[n.icon]) el("image",{href:ICONS[n.icon],x:ix,y:iy,width:IS,height:IS},g);
  else {el("rect",{x:ix,y:iy,width:IS,height:IS,rx:6,fill:"#e8ebef",stroke:"#9aa5b1","stroke-dasharray":"3 2"},g);
        txt(g,n.x,n.y-4,"?",{"text-anchor":"middle","font-size":18,fill:"#5b6470"});}
  const lines=(n.label||"").split("\n");
  lines.forEach((l,i)=>txt(g,n.x,n.y+IS/2+8+i*14,l,{"text-anchor":"middle","font-size":12,"font-weight":600}));
  if(n.sub) txt(g,n.x,n.y+IS/2+8+lines.length*14,n.sub,{"text-anchor":"middle","font-size":10.5,fill:"#5b6470"});
  let bx=ix+IS+2;
  for(const b of n.badges||[]){ // e.g. "ZR", "×3", "Leader", "Primary"
    const bw=Math.max(22,b.length*6.6+10);
    el("rect",{x:bx-bw/2,y:iy-12,width:bw,height:16,rx:8,fill:"#0b5cad"},g);
    txt(g,bx,iy-0.5,b,{"text-anchor":"middle","font-size":9.5,"font-weight":700,fill:"#fff"}); bx+=bw+3;
  }
  if(n.status==="standby") txt(g,n.x,iy-16,"STANDBY",{"text-anchor":"middle","font-size":9.5,"font-weight":700,fill:"#5b6470"});
  n._bottom=n.y+IS/2+8+(lines.length-1)*14+(n.sub?16:4);
}
 
/* ---------- edges ---------- */
function anchor(n,side,off=0){ // off shifts the attach point along the side (px) so parallel edges don't bundle
  const cy=n.y-8, h=IS/2+6;
  return side==="r"?[n.x+h,cy+off]:side==="l"?[n.x-h,cy+off]:side==="t"?[n.x+off,cy-h]:[n.x+off,n._bottom+4];
}
function autoSides(a,b){const dx=b.x-a.x,dy=b.y-a.y;return Math.abs(dx)>=Math.abs(dy)?(dx>0?["r","l"]:["l","r"]):(dy>0?["b","t"]:["t","b"]);}
function route(e){
  const a=N[e.from],b=N[e.to]; const [fs,ts]=e.fromSide&&e.toSide?[e.fromSide,e.toSide]:autoSides(a,b);
  const A=anchor(a,e.fromSide||fs,e.fromOff||0),B=anchor(b,e.toSide||ts,e.toOff||0);
  if(e.via) return [A,...e.via,B];
  const h=s=>s==="l"||s==="r", F=e.fromSide||fs,T=e.toSide||ts;
  if(e.straight||Math.abs(A[0]-B[0])<2||Math.abs(A[1]-B[1])<2) return [A,B];
  if(h(F)&&h(T)){const mx=(A[0]+B[0])/2;return [A,[mx,A[1]],[mx,B[1]],B];}
  if(!h(F)&&!h(T)){const my=(A[1]+B[1])/2;return [A,[A[0],my],[B[0],my],B];}
  return h(F)?[A,[B[0],A[1]],B]:[A,[A[0],B[1]],B];
}
const d=pts=>"M"+pts.map(p=>p.join(",")).join(" L");
const eL=el("g",{id:"edges"}), lL=el("g",{id:"labels"}), pL=el("g",{id:"packets"});
const steps=new Set(); const EG=[];
for(const e of SPEC.edges||[]){
  const s=EDGE[e.kind]||EDGE.sync; used.edges.add(e.kind||"sync");
  const pts=route(e), pd=d(pts); const grp=el("g",{class:"edge","data-step":e.step??""},eL);
  if(s.double){el("path",{d:pd,fill:"none",stroke:s.c,"stroke-width":s.w+3},grp);el("path",{d:pd,fill:"none",stroke:"#fff","stroke-width":s.w-1.5},grp);}

  const L=p.getTotalLength();
  const lg=el("g",{class:"edge","data-step":e.step??""},lL);
  if(e.label){const m=p.getPointAtLength(L*(e.labelAt??.5));
    const t=txt(lg,m.x,m.y+4+(e.labelDy||0),e.label,{"text-anchor":"middle","font-size":10.5,fill:s.c,"font-weight":600});
    const bb=t.getBBox(); const r=el("rect",{x:bb.x-4,y:bb.y-1,width:bb.width+8,height:bb.height+2,rx:3,fill:"#fff",opacity:.92},lg); lg.insertBefore(r,t);}

  const wantPk=e.packets??s.pk;

    const dur=Math.max(1.6,L/140), n=e.packetCount||(L>350?3:2), base=((e.step||1)-1)*0.35;

      const am=el("animateMotion",{dur:dur+"s",repeatCount:"indefinite",begin:(-(base+off)%dur-0.001).toFixed(3)+"s",path:pd,rotate:"auto"},c);

}
